# The blue/green upstream of the CreativityCenter production stack.
#
# This file is REWRITTEN by deploy/deploy.sh on every release and by
# deploy/rollback.sh on a rollback. It is the only thing that decides which
# colour receives traffic; the vhost that includes it never changes.
#
#   blue  -> 127.0.0.1:9010
#   green -> 127.0.0.1:9011
#
# A single server per group is deliberate: nginx never marks the only member of
# a group unavailable, so a slow response cannot take the site out of rotation.
# The deploy script keeps the outgoing colour running until the incoming one
# has passed its health gate, which is what makes the reload lossless.

upstream cc_active {
    server 127.0.0.1:9010;
    keepalive 32;
}