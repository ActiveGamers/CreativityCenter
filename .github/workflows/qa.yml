# Quality gate for every branch and every pull request.
#
# Pint is intentionally absent: formatting stays a local step (`vendor/bin/pint
# --dirty`, see AGENTS.md) and this run is about behaviour. The suite renders
# Blade through Vite, so the assets are built before `php artisan test`.

name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pcntl, exif, imagick
          coverage: none
          tools: composer:v2

      - name: Read the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install the PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install the frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the frontend assets
        run: npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run the test suite
        run: php artisan test
