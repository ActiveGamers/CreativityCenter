# Production counterpart of docker/nginx/default.conf.
#
# The difference is the client-IP contract. In the compose development stack
# this container IS the edge, so $remote_addr is the visitor and the forwarded
# headers are replaced with it. In production the host nginx listens on the
# public port and proxies here, which makes $remote_addr the host edge: passing
# it on would collapse every visitor into one rate-limiter bucket. The chain
# the host edge built is therefore forwarded unchanged, and the maps below fall
# back to this container's own view when a request arrives without the edge
# (the deploy health gate curls the colour port directly).

map $http_x_forwarded_for $cc_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $cc_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $cc_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;

    # -----------------------------------------------------------------------
    # gzip
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Laravel front controller
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite fingerprints every file in public/build, so a URL never changes its
    # content: the browser may keep it forever. This is also what makes the
    # blue/green flip safe - each colour serves its own asset generation.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # PHP - handled by the php-fpm app container of the same colour
    # -----------------------------------------------------------------------
    # Only the front controller is executable. public/storage maps to the
    # shared public media disk, which the app and nginx containers share: a
    # file that ends up there must never be interpreted as PHP.
    location = /index.php {
        include fastcgi_params;

        # Resolved per request: a static fastcgi_pass would keep the address of
        # the previous app container and answer 502 after a recreate.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream app:9000;

        fastcgi_pass $app_upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # $http_host keeps the port; $host would drop it and break every
        # absolute URL Laravel generates (asset(), route(), canonical).
        fastcgi_param HTTP_HOST $http_host;

        fastcgi_param HTTP_X_FORWARDED_FOR $cc_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $cc_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $cc_forwarded_port;

        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other .php request is not a route of this site.
    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Hidden files (except .well-known) are not reachable
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}