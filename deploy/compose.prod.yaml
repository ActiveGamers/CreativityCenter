# ---------------------------------------------------------------------------
# One blue/green colour of the production web tier.
#
# Instantiated twice on the same host, once per colour:
#
#   COLOR=blue  HOST_PORT=9010 docker compose -p cc-blue  -f deploy/compose.prod.yaml up -d
#   COLOR=green HOST_PORT=9011 docker compose -p cc-green -f deploy/compose.prod.yaml up -d
#
# deploy/deploy.sh drives this file: it brings the idle colour up on the new
# image, waits for its health gate, runs the migrations, and only then points
# the host nginx upstream at its loopback port and reloads. The colour that
# served traffic until then keeps running, so a rollback is another reload
# rather than a rebuild.
#
# Nothing here is stateful. The database and the queue live in
# deploy/compose.data.yaml; uploads, sessions-derived data and the environment
# file live in shared/ and are mounted into both colours, which is what lets a
# visitor keep their session and their uploaded file across a flip.
#
# The source tree is NOT bind mounted (that is the development stack): the image
# carries the code, the Composer dependencies and the compiled Vite assets, so
# a colour is exactly the commit it was built from.
# ---------------------------------------------------------------------------

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE to the release tag}
  working_dir: /var/www/html
  env_file:
    - ${SHARED_DIR:?set SHARED_DIR}/.env
  environment:
    # The deploy script owns `migrate`: a container that migrates on start up
    # would race the other colour on the same schema.
    AUTO_MIGRATE: "false"
  volumes:
    - ${SHARED_DIR:?}/.env:/var/www/html/.env:ro
    - ${SHARED_DIR:?}/storage:/var/www/html/storage
  networks:
    - internal
    - data
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app

  nginx:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the release tag}
    ports:
      # Loopback only: the host nginx is the sole public entry point, and it is
      # the file it includes that decides which colour receives traffic.
      - "127.0.0.1:${HOST_PORT:?set HOST_PORT}:80"
    volumes:
      - ${SHARED_DIR:?}/storage:/var/www/html/storage:ro
    networks:
      - internal
    depends_on:
      - app
    healthcheck:
      # Through nginx into php-fpm and the framework health route: a pass means
      # the whole request path of this colour works, not just that a process is
      # up. Laravel's /up boots the framework and checks the database.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

networks:
  internal:
    driver: bridge
  data:
    external: true
    name: creativitycenter-data