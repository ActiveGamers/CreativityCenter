# ============================================================================
# CreativityCenter - host nginx edge (public entry point).
#
# Installed at /etc/nginx/conf.d/CreativityCenter.conf by deploy/provision.sh.
# This file is static: a release never edits it. The colour that receives
# traffic is chosen by the upstream file it includes, which deploy/deploy.sh
# rewrites before a graceful `nginx -s reload`. Old workers finish the requests
# they already accepted, so the flip drops no connection.
#
# Temporary port 5517 until a domain is bought. It is already open in ufw, so
# no firewall change is needed. When the domain arrives this block gains
# `listen 443 ssl` + the certificate and a redirect from 80; the upstream
# contract below does not change.
#
# Two layers, as with the other apps on this host: this edge proxies everything
# (static files, PHP, media) to the colour's own nginx container, which owns the
# webroot and talks to php-fpm. Do not add root/index/php/location-build blocks
# here - they live in docker/nginx/prod.conf inside the repository.
# ============================================================================

include /srv/apps/CreativityCenter/shared/nginx/upstream.conf;

server {
    listen 5517;
    listen [::]:5517;

    server_name _;

    client_max_body_size 25m;

    access_log /var/log/nginx/CreativityCenter.access.log;
    error_log  /var/log/nginx/CreativityCenter.error.log warn;

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        proxy_pass http://cc_active;

        proxy_http_version 1.1;
        # Empty Connection header: the upstream keepalive pool stays usable.
        proxy_set_header Connection "";

        # $http_host keeps the port. $host would drop :5517 and break every
        # absolute URL Laravel generates (asset(), route(), canonical).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # SET, not $proxy_add_x_forwarded_for. This is the outermost hop, so
        # appending would keep a client-supplied X-Forwarded-For in front of the
        # real address - and Laravel trusts the whole chain, which would let a
        # visitor pick their own rate-limiter bucket. The colour's nginx passes
        # this value through unchanged.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}