server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;

    # -----------------------------------------------------------------------
    # gzip
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # nginx gzips text/html by default; the extra types are listed here.
    # (Listing a type that nginx already enables by default raises a
    # "duplicate MIME type" warning, so text/html is not repeated.)
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Laravel front controller
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # PHP - handled by the php-fpm app container
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # $http_host keeps the port; $host would drop it and break every
        # absolute URL Laravel generates (asset(), route(), canonical).
        fastcgi_param HTTP_HOST $http_host;

        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -----------------------------------------------------------------------
    # Hidden files (except .well-known) are not reachable
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
